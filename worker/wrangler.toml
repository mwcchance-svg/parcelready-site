# ParcelReady store worker. Bindings only; secrets are set with
# `wrangler secret put` at deploy time and never live in this file.
name = "parcelready-store"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Routes: attach to the site domain at deploy (Workers route on
# parcelreadydata.com/api/*). The static site stays on GitHub Pages.
# routes = [{ pattern = "parcelreadydata.com/api/*", zone_name = "parcelreadydata.com" }]

[vars]
SITE_BASE = "https://parcelreadydata.com"
# The Worker's own public origin (workers.dev until a custom route exists).
# Download links and the webhook registration use it. Set at deploy.
API_BASE = "SET_AT_DEPLOY"
ALLOWED_ORIGINS = "https://parcelreadydata.com,https://mwcchance-svg.github.io"
MAIL_FROM = "ParcelReady <delivery@parcelreadydata.com>"
LEADS_INBOX = "hello@parcelreadydata.com"
# TAX_MODE stays "off" until the CPA ruling lands (see STORE-ARCHITECTURE.md).
TAX_MODE = "off"

[[r2_buckets]]
binding = "PACK_FILES"
bucket_name = "parcelready-files"

[[kv_namespaces]]
binding = "TOKENS"
id = "SET_AT_DEPLOY"

[[kv_namespaces]]
binding = "LEADS"
id = "SET_AT_DEPLOY"

# Secrets (dashboard-set on the Worker; they persist across deploys and
# never live in this file or on any workstation):
#   STRIPE_SECRET_KEY       restricted key, placed screen to screen from
#                           the Stripe reveal dialog (Nov 23, 2026 ruling)
#   RESEND_API_KEY          delivery email provider (later step)
#   ADMIN_TOKEN             optional; enables POST /api/admin/sync
# The webhook signing secret is NOT set by hand: the Worker registers
# its own endpoint and keeps the secret in the TOKENS KV.
